name: CodeQL

# GitHub's default CodeQL code-scanning template, scoped to this repo's single
# language (JavaScript/TypeScript covers the Astro + React source). Findings
# appear in the Security tab and as informational PR checks - this workflow
# does not gate merges.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Sunday 03:00 UTC.
    - cron: '0 3 * * 0'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          # scripts/ holds build-time generator/validator scripts (regex over
          # local JSON, self-generated HTML for SEO assets) that CodeQL
          # repeatedly flags as false positives - they never touch untrusted
          # user input. Excluded from analysis to cut noise in the Security tab.
          config: |
            paths-ignore:
              - scripts/

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:javascript-typescript'
