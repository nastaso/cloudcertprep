name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default token: CI only reads the repo (checkout + npm). No
# job here writes issues, PRs, or contents. (security V11)
permissions:
  contents: read

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    # The build prerenders pages that import the Supabase client, which throws if
    # these are missing. They are public client-side values (the anon key is in the
    # shipped bundle), provided to CI as repo secrets so .env (gitignored) is not needed.
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate question bank
        run: npm run validate

      - name: Lint
        run: npm run lint

      - name: Type-check (Astro + TS)
        run: npm run check:astro

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # `npm run build` already runs check:citation + check:graph +
      # check:person-graph via its postbuild hook, so they are not repeated here.
      # --- Delivery Phase 2 quality gates (informational) ---
      - name: free-for-dev backlink check (informational)
        run: npm run check:free-for-dev || echo "free-for-dev check failed (informational; upstream edits are outside our control)"

      - name: Indexing diagnostic (informational)
        run: node scripts/diagnose-indexing.mjs --base https://www.cloudcertprep.io || echo "indexing diagnostic reported issues (informational)"

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        run: npm run check:lighthouse
