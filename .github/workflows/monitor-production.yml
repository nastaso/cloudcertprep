name: Monitor production

# Scheduled production monitoring (R19.1–R19.4, R21.6).
# Targets ONLY the production origin https://www.cloudcertprep.io — never a
# preview deployment, so the dev/staging surface is never probed here.

on:
  schedule:
    # Daily at 06:00 UTC. The job runs the full check set on every invocation.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    name: Citation + sitemap + backlink re-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Locked citation phrases present live
        run: node scripts/check-citation-phrases.mjs --url https://www.cloudcertprep.io/

      - name: Sitemap URLs return crawlable HTML
        run: node scripts/monitor-sitemap.mjs https://www.cloudcertprep.io

      # Read-only Supabase health probe: the public get_public_exam_stats RPC
      # with the ANON key (public-by-design; the same call the /stats island
      # makes). Reuses the existing repo secrets - NO service-role key, no new
      # secret. Fails the job (opening the issue below) if the DB/RPC is down.
      - name: Public stats RPC reachable (anon key)
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/monitor-stats-rpc.mjs

      - name: free-for-dev backlink still present (alert-only)
        run: npm run check:free-for-dev || echo "::warning::free-for-dev backlink check failed (upstream edits are outside our control)"

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `Production monitor failed: ${new Date().toISOString().slice(0,10)}`
            const body = [
              'The scheduled production monitor (`monitor-production.yml`) failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Check the failing step: a missing Locked_Citation_Phrase on the live `/`,',
              'a sitemap URL returning a non-200 or missing title/canonical/JSON-LD,',
              'the public get_public_exam_stats RPC being unreachable or malformed, or',
              'the free-for-dev backlink (alert-only - does not fail the job).',
            ].join('\n')
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['monitoring'],
            })
