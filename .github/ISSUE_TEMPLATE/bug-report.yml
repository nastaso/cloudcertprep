name: Bug report
description: Something is broken or behaving unexpectedly.
title: "Bug: <short description>"
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What did you do, and what happened that you didn't expect?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /practice-exam
        2. Click "Start Exam"
        3. Observe ...
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 130 on Windows 11
  - type: textarea
    id: console
    attributes:
      label: Console errors (optional)
      description: Open DevTools, click Console, and paste any red error messages here.
      render: shell
